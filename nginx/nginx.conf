events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    resolver 8.8.8.8 valid=30s;

    upstream f2m_engine   { server f2m-engine:1488; }
    upstream waiter_api   { server waiter-api:8000; }
    upstream waiter_web   { server waiter-web:3000; }
    upstream ai_menu      { server ai-menu:80; }
    upstream broadcast_web { server broadcast-web:80; }
    upstream broadcast_api { server broadcast-api:8000; }
    upstream panel        { server panel:8000; }
    upstream platform_api { server api:8000; }
    upstream load_menu    { server admin-load-menu:5050; }

    server {
        listen 80;
        server_name food2moodapi.ru www.food2moodapi.ru;

        location / {
            proxy_pass http://platform_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 80 default_server;

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # iiko Admin Panel
        location /iiko-admin/ {
            alias /srv/admin_iiko/dist/;
            try_files $uri $uri/ /iiko-admin/index.html;
            add_header Cache-Control "no-cache";
        }

        # iiko API CORS proxy
        location /iiko/ {
            proxy_pass https://api-ru.iiko.services/;
            proxy_set_header Host api-ru.iiko.services;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
        }

        # Waiter (default route)
        location / {
            proxy_pass http://waiter_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Waiter API
        location /api/v1/waiter/ {
            proxy_pass http://waiter_api/api/v1/waiter/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # f2m-engine — block config mutations from public access
        location ~ ^/api/engine/config {
            return 403;
        }

        location /api/engine/ {
            proxy_pass http://f2m_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI Menu
        location /menu/ {
            proxy_pass http://ai_menu/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Broadcast frontend
        location /broadcast/ {
            proxy_pass http://broadcast_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Load Menu Admin
        location /load-menu/ {
            proxy_pass http://load_menu/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 50m;
        }

        # Admin Panel UI
        location /panel/ {
            proxy_pass http://panel/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Panel API
        location /api/v1/admin/ {
            proxy_pass http://panel/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Broadcast API
        location /api/v1/broadcast/ {
            proxy_pass http://broadcast_api/api/v1/broadcast/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Platform API
        location /api/v1/premium-bonus/ {
            proxy_pass http://platform_api/api/v1/premium-bonus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Coffeemania recommendation adapter
        location /api/coffeemania/ {
            proxy_pass http://platform_api/api/coffeemania/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
