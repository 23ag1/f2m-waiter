name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "==> Pulling latest code..."
            cd /srv/app/Food2Mood-demo/frontend-waiter
            git pull origin main

            echo "==> Updating backend..."
            cp -r /srv/app/Food2Mood-demo/frontend-waiter/backend/. /srv/app/Food2Mood-demo/backend/

            echo "==> Rebuilding frontend container..."
            cd /srv/app/Food2Mood-demo
            docker compose build waiter_web
            docker compose up -d waiter_web

            echo "==> Restarting backend API..."
            docker compose restart api

            echo "==> Deploy complete!"
