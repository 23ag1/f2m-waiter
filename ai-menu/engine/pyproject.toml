[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f2m-engine"
version = "0.1.0"
description = "Food2Mood recommendation engine — standalone API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "httpx>=0.27,<1.0",
]

[project.scripts]
f2m = "f2m_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
